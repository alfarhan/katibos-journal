[common]
default_envs = rev_8
platform = espressif32@7.0.1
framework = arduino

[platformio]
boards_dir = boards




; ------------------------------------------
; MICRO JOURNAL REVISION 8
; ST7306 300x400 reflective LCD
; YDP420H001-V3
; ------------------------------------------
[env:rev_8]
extends = common
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = dio_opi
board_build.arduino_psram = enabled
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 4128768
board_build.filesystem = fatfs
board_build.partitions = partition_esp32s3_rev8_16mb.csv
upload_speed =  921600
monitor_speed = 115200
monitor_filters =
	default
	esp32_exception_decoder

lib_deps =
  ArduinoJson
  https://github.com/adafruit/Adafruit_Keypad
  https://github.com/h2zero/NimBLE-Arduino.git

build_src_filter =
  -<*>
  +<main.cpp>
  +<app/*>
  ;
  +<display/display.*>
  +<display/RLCD/*>
  ;
  +<keyboard/keyboard.*>
  +<keyboard/Keypad/Keypad.*>
  +<keyboard/Keypad/68/*>
  +<keyboard/Locale/*>
  +<keyboard/BLEHost/*>
  ;
  +<service/Tools/*>
  +<service/Editor/*>
  +<service/Clock/*>
  +<service/Bidi/*>
  +<service/Updater/*>
  +<service/WifiEntry/*>
  +<service/Buffer/*>
  +<service/Sync/*>
  +<service/WordCounter/*>
  +<service/Send/*>
  +<service/MassStorage/*>

lib_ignore =
  FatFSUSB
  EPD
  EspUsbHost
  USBHIDBoot

build_flags =
  ;
  ;-D USE_SERIAL_KEYBOARD

  ; Configuration
  -D REV8
  -D KEYPAD_68
  -D BOARD_ESP32_S3
  -D USE_MSC ; mass storage
  -D USE_FAT
  -D FIRMWARE=\"/firmware_rev_8.bin\"

  ; DISPLAY
  -D PIN_SCLK=12
  -D PIN_MOSI=11
  -D PIN_CS=10
  -D PIN_DC=46
  -D PIN_RST=3

  ; ESP32 S3
  -D BOARD_HAS_PSRAM
  -DCONFIG_SPIRAM_CACHE_WORKAROUND
  -mfix-esp32-psram-cache-issue
  -mfix-esp32-psram-cache-strategy=memw


[env:rev_8_type1]
extends = env:rev_8
build_flags =
  ${env:rev_8.build_flags}
  -D RLCD_TYPE=1


[env:rev_8_type2]
extends = env:rev_8
build_flags =
  ${env:rev_8.build_flags}
  -D RLCD_TYPE=2


; ------------------------------------------
; WAVESHARE ESP32-S3-RLCD-4.2
; Same ST7305 300x400 panel as rev_8, different wiring.
; No matrix keypad -> type over USB serial (USE_SERIAL_KEYBOARD),
; and connect a BLE keyboard as a HID host (USE_BLE_KEYBOARD_HOST).
; ------------------------------------------
[env:rev_8_waveshare]
extends = env:rev_8
build_flags =
  ; Configuration
  -D REV8
  -D KEYPAD_68
  -D BOARD_ESP32_S3
  -D USE_MSC
  -D USE_FAT
  -D FIRMWARE=\"/firmware_rev_8.bin\"

  ; No physical keypad on this board — accept keystrokes over USB serial
  -D USE_SERIAL_KEYBOARD

  ; ...and over Bluetooth: connect to a BLE keyboard as a HID host
  -D USE_BLE_KEYBOARD_HOST

  ; Route Serial (typing + logs) to the ESP32-S3 native USB on the Type-C port
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=1

  ; DISPLAY — Waveshare ESP32-S3-RLCD-4.2 pinout (ST7305)
  -D PIN_SCLK=11
  -D PIN_MOSI=12
  -D PIN_CS=40
  -D PIN_DC=5
  -D PIN_RST=41

  ; ESP32 S3
  -D BOARD_HAS_PSRAM
  -DCONFIG_SPIRAM_CACHE_WORKAROUND
  -mfix-esp32-psram-cache-issue
  -mfix-esp32-psram-cache-strategy=memw
